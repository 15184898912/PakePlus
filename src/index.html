/* ==================== 编辑器 ==================== */

/* ==================== 聊天界面 ==================== */

.history-template-panel { flex: 1; display: flex; overflow: hidden; }

@keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: none; } }
.toast.hide { animation: toastOut 0.3s ease forwards; }

/* ==================== 模态框 ==================== */
.modal-overlay {

}

                        <label>API 密钥</label>
                        <div class="input-row">
                            <input type="password" id="apiKey" placeholder="sk-...">
                            <button class="pw-toggle" onclick="togglePw()" title="显示/隐藏">&#128065;</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>模型名称</label>

                </div>

                    <div class="card-title"><span class="icon">&#127916;</span> 口播场景</div>

                            <option value="shortvideo">短视频 - 爆款开场</option>
                            <option value="news">新闻播报 - 正式风格</option>

                    </div>
                </div>

                    <div class="form-group">

                        <label>口播时长</label>

                            <option value="90">90 秒</option>
                            <option value="180">3 分钟</option>
                        </select>
                    </div>
                    <div class="form-group">

                        <button class="btn btn-block btn-sm" onclick="generateMultiVersions()">&#128196; 一键生成多版本</button>
                    </div>
                </div>

            </div>
        </aside>

        <!-- ===== 右侧工作区 ===== -->
        <main class="right-panel">

            <!-- 标签栏 -->
            <div class="tab-bar">

                <button class="tab-btn" onclick="switchTab(3)">&#128218; 历史记录与模板库</button>
            </div>

<script>
/* ==================== 全局状态 ==================== */
const STATE = {

};

/* ==================== 模板数据 ==================== */
const TEMPLATES = {

    },
    "悬念开头+价值揭示式": {
        desc: "用反常识的问题或惊人的事实开头制造悬念，逐步揭示核心价值。适合知识分享、课程推广类口播。",
        example: "你知道吗？90%的人都在用错误的方法做这件事！\n（悬念开头：打破认知）\n\n今天我要告诉你一个被行业隐藏了三年的秘密...\n（价值预告）\n\n第一步：...\n第二步：...\n第三步：...\n（分步揭示价值）\n\n学会这个方法，至少帮你节省80%的时间。\n（价值总结+行动号召）"
    },

        desc: "通过明确目标用户身份，建立情感连接和信任感。适合品牌建设、个人IP类口播。",
        example: "作为一个（目标身份），你最关心的是什么？\n（身份确认：筛选目标受众）\n\n我知道你的不容易，因为我也经历过...\n（共情：建立情感连接）\n\n但今天我想告诉你，一切都会改变。\n（转折：引出希望）\n\n因为（核心价值/产品优势）\n（价值呈现）\n\n关注我，带你一起成长！\n（持续互动号召）"
    },
    "数据震撼+权威背书式": {
        desc: "用震撼的数据和权威信息开头建立专业可信度。适合测评、科普、专业领域类口播。",
        example: "根据最新数据显示，这个市场规模已经超过了3000亿！\n（数据震撼：建立权威感）\n\nXX机构/专家的研究表明...\n（权威背书：增强可信度）\n\n而在这么大的市场里，只有不到1%的人掌握了正确的方法。\n（制造稀缺感）\n\n今天我就来揭秘这个方法的3个核心要点...\n（引出内容）\n\n建议先收藏，随时复习！\n（互动号召）"
    },
    "场景代入+使用体验式": {
        desc: "通过生动的场景描述让用户身临其境，再分享真实使用体验。适合好物推荐、生活类口播。",
        example: "想象一下这个场景：\n（场景描述：让用户代入）\n\n这就是我每天的真实生活，自从用了它之后...\n（引入产品+对比）\n\n它的（特点1）让我特别惊喜，\n（特点2）简直太方便了，\n（特点3）是我用过同类产品中最好的！\n（体验分享）\n\n如果你也想拥有这样的体验，链接就在下方！\n（行动号召）"
    }
};

/* ==================== 场景映射 ==================== */
const SCENE_MAP = {
    livestream: { name: "直播带货", style: "激情、紧迫、转化导向，使用大量感叹号和限时话术" },
    knowledge: { name: "知识口播", style: "沉稳、专业、有深度，逻辑清晰，娓娓道来" },
    shortvideo: { name: "短视频", style: "前3秒抓住注意力，节奏快，金句频出，适合完播率" },
    news: { name: "新闻播报", style: "正式、客观、权威，语气平稳，信息密度高" },
    custom: { name: "自定义", style: "根据用户需求灵活调整风格" }
};

const AUDIENCE_MAP = {
    young_female: "年轻女性（18-35岁）",
    middle_male: "中年男性（35-55岁）",
    moms: "宝妈群体",
    tech: "科技爱好者",
    general: "通用受众"
};

/* ==================== 系统Prompt ==================== */
const SYSTEM_PROMPT = `你是顶尖的口播文案专家，擅长短视频口播、直播带货、知识分享等各类口播稿撰写。你输出的文案需要：
1. 口语化，适合朗读，不用书面语和生僻词
2. 节奏感强，长短句结合，有韵律感
3. 有情绪张力和感染力，能打动听众
4. 符合指定风格和时长要求
5. 适当使用强调词、停顿标记（用「...」表示停顿）
6. 直接输出口播稿正文，不要多余的解释和前言`;

/* ==================== 初始化 ==================== */
document.addEventListener('DOMContentLoaded', function() {
    loadConfig();
    loadHistory();
    loadTemplates();
    updateClock();
    setInterval(updateClock, 1000);
    setupEditorListeners();
    setupTTSListeners();
});

/* ==================== 时钟 ==================== */
function updateClock() {
    const now = new Date();
    const str = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clockStatus').textContent = str;
}

/* ==================== Toast 通知 ==================== */
function showToast(msg, type='info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.add('hide'); }, 2500);
    setTimeout(() => { toast.remove(); }, 2800);
}

/* ==================== 密码切换 ==================== */
function togglePw() {
    const inp = document.getElementById('apiKey');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}

/* ==================== 配置管理 ==================== */
function loadConfig() {
    try {
        const saved = localStorage.getItem('ai_speaking_config');
        if (saved) {
            const cfg = JSON.parse(saved);
            document.getElementById('apiBase').value = cfg.api_base || 'https://api.openai.com/v1';
            document.getElementById('apiKey').value = cfg.api_key || '';
            document.getElementById('modelName').value = cfg.model_name || 'gpt-4o';
            document.getElementById('ttsProvider').value = cfg.tts_provider || 'browser_tts';
            document.getElementById('voiceSelect').value = cfg.voice || 'alloy';
            document.getElementById('speedSlider').value = cfg.speed || 1.0;
            document.getElementById('speedLabel').textContent = (cfg.speed || 1.0).toFixed(1) + 'x';
        }
    } catch(e) { /* 忽略 */ }
}

function saveConfig() {
    const cfg = {
        api_base: document.getElementById('apiBase').value.trim(),
        api_key: document.getElementById('apiKey').value.trim(),
        model_name: document.getElementById('modelName').value.trim(),
        tts_provider: document.getElementById('ttsProvider').value,
        voice: document.getElementById('voiceSelect').value,
        speed: parseFloat(document.getElementById('speedSlider').value)
    };
    localStorage.setItem('ai_speaking_config', JSON.stringify(cfg));
    showToast('配置已保存', 'success');
}

function getConfig() {
    return {
        api_base: document.getElementById('apiBase').value.trim() || 'https://api.openai.com/v1',
        api_key: document.getElementById('apiKey').value.trim(),
        model_name: document.getElementById('modelName').value.trim() || 'gpt-4o'
    };
}

/* ==================== API 连接测试 ==================== */
async function testConnection() {
    const cfg = getConfig();
    if (!cfg.api_key) { showToast('请先填写 API 密钥', 'error'); return; }
    showToast('正在测试连接...', 'info');
    try {
        const base = cfg.api_base.replace(/\/+$/, '');
        const resp = await fetch(base + '/models', {
            headers: { 'Authorization': 'Bearer ' + cfg.api_key },
            signal: AbortSignal.timeout(10000)
        });
        if (resp.ok) {
            document.getElementById('statusDot').classList.add('connected');
            document.getElementById('statusText').textContent = '已连接';
            showToast('连接成功！', 'success');
        } else if (resp.status === 401) {
            showToast('API 密钥无效', 'error');
        } else {
            showToast('连接失败 (HTTP ' + resp.status + ')', 'error');
        }
    } catch(e) {
        showToast('网络连接失败: ' + e.message, 'error');
    }
}

/* ==================== API 调用 ==================== */
async function callAPI(messages) {
    const cfg = getConfig();
    if (!cfg.api_key) { showToast('请先填写 API 密钥', 'error'); return null; }
    if (STATE.apiBusy) { showToast('正在处理中，请稍候...', 'info'); return null; }
    STATE.apiBusy = true;
    try {
        const base = cfg.api_base.replace(/\/+$/, '');
        const resp = await fetch(base + '/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + cfg.api_key
            },
            body: JSON.stringify({
                model: cfg.model_name,
                messages: messages,
                stream: false,
                temperature: 0.8
            }),
            signal: AbortSignal.timeout(120000)
        });
        if (resp.ok) {
            const data = await resp.json();
            return data.choices[0].message.content;
        } else {
            const err = await resp.json().catch(() => ({}));
            const msg = (err.error && err.error.message) || ('HTTP ' + resp.status);
            if (resp.status === 401) showToast('API 密钥无效', 'error');
            else if (resp.status === 402 || resp.status === 429) showToast('余额不足或请求受限', 'error');
            else showToast('API 错误: ' + msg, 'error');
            return null;
        }
    } catch(e) {
        showToast('请求失败: ' + e.message, 'error');
        return null;
    } finally {
        STATE.apiBusy = false;
    }
}

/* ==================== 生成 Prompt ==================== */
function buildGeneratePrompt() {
    const topic = document.getElementById('topicInput').value.trim();
    const keywords = document.getElementById('keywordsInput').value.trim();
    const duration = document.getElementById('durationSelect').value;
    const audience = document.getElementById('audienceSelect').value;
    const emotion = document.getElementById('emotionSlider').value;
    const scene = document.getElementById('sceneSelect').value;

    const sceneInfo = SCENE_MAP[scene] || SCENE_MAP.custom;
    const audienceStr = AUDIENCE_MAP[audience] || '通用受众';
    const emotionDesc = emotion <= 3 ? '理性沉稳、娓娓道来' :
                        emotion <= 6 ? '张弛有度、自然真诚' :
                        '激情澎湃、充满感染力';
    const wordCount = Math.round(parseInt(duration) * 3); // 按每分钟180字估算

    let prompt = `请撰写一段口播文案，具体要求如下：\n`;
    prompt += `- 口播场景：${sceneInfo.name}（${sceneInfo.style}）\n`;
    prompt += `- 主题/产品：${topic || '由你根据场景自由发挥'}\n`;
    if (keywords) prompt += `- 核心关键词：${keywords}\n`;
    prompt += `- 目标时长：约${duration}秒（约${wordCount}字）\n`;
    prompt += `- 目标受众：${audienceStr}\n`;
    prompt += `- 情绪风格：${emotionDesc}（${emotion}/10）\n`;
    prompt += `\n请直接输出口播稿正文。`;

    return prompt;
}

/* ==================== AI 生成口播文案 ==================== */
async function generateScript() {
    const topic = document.getElementById('topicInput').value.trim();
    if (!topic) { showToast('请先输入产品/主题', 'error'); return; }

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-loading"></span> 正在生成...';

    const prompt = buildGeneratePrompt();
    const result = await callAPI([
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: prompt }
    ]);

    btn.disabled = false;
    btn.innerHTML = '&#9889; AI 生成口播文案';

    if (result) {
        setEditorContent(result);
        highlightEditor();
        saveToHistory(result);
        showToast('文案生成成功！', 'success');
    }
}

/* ==================== 文案润色 ==================== */
async function polishScript() {
    const content = getEditorContent();
    if (!content) { showToast('编辑器中没有内容', 'error'); return; }
    showToast('正在润色...', 'info');
    const result = await callAPI([
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: '请对以下口播稿进行润色优化，使其更流畅、更有感染力、更适合朗读。保持原意不变，直接输出润色后的完整文稿：\n\n' + content }
    ]);
    if (result) {
        setEditorContent(result);
        highlightEditor();
        showToast('润色完成！', 'success');
    }
}

/* ==================== 提取卖点 ==================== */
async function extractSellingPoints() {
    const content = getEditorContent();
    if (!content) { showToast('编辑器中没有内容', 'error'); return; }
    showToast('正在提取...', 'info');
    const result = await callAPI([
        { role: 'system', content: '你是一个专业的营销分析师，擅长从文案中提取核心卖点和关键信息。请以条目化的方式输出。' },
        { role: 'user', content: '请从以下口播稿中提取核心卖点和关键信息，以编号列表形式输出：\n\n' + content }
    ]);
    if (result) {
        switchTab(1);
        addChatMessage('ai', '【核心卖点提取】\n\n' + result);
        showToast('卖点提取完成！', 'success');
    }
}

/* ==================== 多版本生成 ==================== */
async function generateMultiVersions() {
    const topic = document.getElementById('topicInput').value.trim();
    if (!topic) { showToast('请先输入产品/主题', 'error'); return; }

    showToast('正在生成3个版本...', 'info');
    const styles = ['激情带货风', '专业知识风', '轻松生活风'];
    const results = [];
    for (const style of styles) {
        const result = await callAPI([
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: buildGeneratePrompt() + `\n\n请用「${style}」重新撰写。只输出口播稿正文。` }
        ]);
        if (result) results.push({ style, content: result });
    }

    if (results.length > 0) {
        switchTab(1);
        let msg = '【多版本生成完成】\n\n';
        results.forEach((r, i) => {
            msg += `═══ 版本${i+1}：${r.style} ═══\n${r.content}\n\n`;
        });
        addChatMessage('ai', msg);
        // 第一个版本放入编辑器
        setEditorContent(results[0].content);
        highlightEditor();
        showToast('已生成 ' + results.length + ' 个版本', 'success');
    }
}

/* ==================== 编辑器功能 ==================== */
function getEditorContent() {
    return document.getElementById('editorTextarea').value;
}

function setEditorContent(text) {
    document.getElementById('editorTextarea').value = text;
    updateEditorStats();
    updateLineNumbers();
}

function clearEditor() {
    if (getEditorContent()) {
        showModal('确认清空', '确定要清空编辑器中的所有内容吗？', () => {
            setEditorContent('');
            showToast('已清空', 'info');
        });
    }
}

function copyAll() {
    const text = getEditorContent();
    if (!text) { showToast('编辑器为空', 'info'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'));
}

function editorUndo() { document.getElementById('editorTextarea').focus(); document.execCommand('undo'); }
function editorRedo() { document.getElementById('editorTextarea').focus(); document.execCommand('redo'); }

function changeFontSize() {
    const size = document.getElementById('fontSizeSelect').value;
    document.getElementById('editorTextarea').style.fontSize = size + 'px';
    document.getElementById('lineNumbers').style.fontSize = size + 'px';
}

function exportTxt() {
    const text = getEditorContent();
    if (!text) { showToast('编辑器为空', 'info'); return; }
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '口播文案_' + new Date().toISOString().slice(0,10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    showToast('已导出 TXT 文件', 'success');
}

function highlightEditor() {
    const ta = document.getElementById('editorTextarea');
    ta.classList.remove('editor-highlight');
    void ta.offsetWidth; // 触发回流
    ta.classList.add('editor-highlight');
}

/* ==================== 编辑器统计 ==================== */
function updateEditorStats() {
    const text = getEditorContent();
    const chars = text.replace(/\s/g, '').length;
    const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim()).length || (text.trim() ? 1 : 0);
    const duration = Math.round(chars / 3); // 每分钟180字

    document.getElementById('statChars').textContent = chars;
    document.getElementById('statDuration').textContent = duration;
    document.getElementById('statParagraphs').textContent = paragraphs;
    document.getElementById('wordCountStatus').textContent = '字数: ' + chars;
}

function updateLineNumbers() {
    const text = getEditorContent();
    const lines = text.split('\n').length;
    const nums = [];
    for (let i = 1; i <= lines; i++) nums.push(i);
    document.getElementById('lineNumbers').textContent = nums.join('\n');
}

function setupEditorListeners() {
    const ta = document.getElementById('editorTextarea');
    ta.addEventListener('input', () => { updateEditorStats(); updateLineNumbers(); });
    ta.addEventListener('scroll', () => {
        document.getElementById('lineNumbers').scrollTop = ta.scrollTop;
    });
    // Ctrl+S 保存配置
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveConfig(); }
    });
}

function switchTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));

/* ==================== 聊天功能 ==================== */
function addChatMessage(role, content) {
    const container = document.getElementById('chatMessages');
    // 移除欢迎文字
    const welcome = container.querySelector('div[style*="text-align:center"]');
    if (welcome) welcome.remove();

    const msgDiv = document.createElement('div');
    msgDiv.className = 'chat-msg ' + role;
    const avatarText = role === 'user' ? '我' : 'AI';
    msgDiv.innerHTML = `
        <div class="chat-avatar">${avatarText}</div>
        <div class="chat-bubble">${escapeHtml(content)}</div>
    `;
    container.appendChild(msgDiv);
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
}

function addTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'chat-msg ai';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="chat-avatar">AI</div>
        <div class="chat-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
    `;
    container.appendChild(typingDiv);
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

async function sendChat() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addChatMessage('user', text);
    STATE.chatHistory.push({ role: 'user', content: text });

    // 构建带文稿上下文的消息
    const editorContent = getEditorContent();
    const messages = [
        { role: 'system', content: '你是一个专业口播文案专家，根据用户要求修改提供的口播稿。如果用户提到"当前文稿"，请参考以下内容：\n\n【当前文稿】\n' + (editorContent || '（编辑器为空）') },
        ...STATE.chatHistory.slice(-10) // 最近10轮对话
    ];

    addTypingIndicator();
    const result = await callAPI(messages);
    removeTypingIndicator();

    if (result) {
        addChatMessage('ai', result);
        STATE.chatHistory.push({ role: 'assistant', content: result });
    }
}

/* ==================== 数字人预览 / TTS ==================== */
function setupTTSListeners() {
    document.getElementById('speedSlider').addEventListener('input', function() {
        document.getElementById('speedLabel').textContent = parseFloat(this.value).toFixed(1) + 'x';
    });
    document.getElementById('ttsProvider').addEventListener('change', function() {
        const sel = document.getElementById('voiceSelect');
        sel.innerHTML = '';
        if (this.value === 'openai_tts') {
            [['alloy','知性女声'],['echo','温柔男声'],['nova','活泼女声'],['onyx','沉稳男声']].forEach(([v,l]) => {
                sel.innerHTML += `<option value="${v}">${l}</option>`;
            });
            sel.disabled = false;
        } else {
            // 浏览器TTS: 列出系统可用中文语音
            const voices = speechSynthesis.getVoices();
            const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
            if (zhVoices.length > 0) {
                zhVoices.forEach((v, i) => {
                    const label = v.name.replace(/Microsoft |Google /, '');
                    sel.innerHTML += `<option value="${i}">${label}</option>`;
                });
            } else {
                sel.innerHTML = '<option value="0">默认系统语音</option>';
            }
            sel.disabled = false;
        }
    });
    // 初始化加载浏览器语音列表
    if (typeof speechSynthesis !== 'undefined') {
        const loadVoices = () => {
            const sel = document.getElementById('voiceSelect');
            if (sel.options.length <= 1 || document.getElementById('ttsProvider').value === 'browser_tts') {
                const voices = speechSynthesis.getVoices();
                const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
                sel.innerHTML = '';
                if (zhVoices.length > 0) {
                    zhVoices.forEach((v, i) => {
                        const realIdx = voices.indexOf(v);
                        const label = v.name.replace(/Microsoft |Google /, '') + ' (' + v.lang + ')';
                        sel.innerHTML += `<option value="${realIdx}">${label}</option>`;
                    });
                } else {
                    // 如果没有中文语音，列出所有语音
                    voices.forEach((v, i) => {
                        const label = v.name.replace(/Microsoft |Google /, '') + ' (' + v.lang + ')';
                        sel.innerHTML += `<option value="${i}">${label}</option>`;
                    });
                    if (voices.length === 0) {
                        sel.innerHTML = '<option value="0">默认系统语音</option>';
                    }
                }
            }
        };
        speechSynthesis.onvoiceschanged = loadVoices;
        // 延迟加载一次
        setTimeout(loadVoices, 500);
    }
}

function drawIdleWaveform() {
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const bars = 40;
    const bw = (w - bars) / bars;
    for (let i = 0; i < bars; i++) {
        const bh = Math.max(2, Math.random() * 8);
        ctx.fillStyle = 'rgba(212,175,55,0.2)';
        ctx.fillRect(i * (bw + 1), (h - bh) / 2, bw, bh);
    }
}

function drawWaveform(timestamp) {
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const bars = 40;
    const bw = (w - bars) / bars;
    for (let i = 0; i < bars; i++) {
        const phase = timestamp / 150 + i * 0.3;
        const bh = Math.max(3, (Math.sin(phase) * 0.5 + 0.5) * h * 0.8 * (0.3 + Math.random() * 0.7));
        const grad = ctx.createLinearGradient(0, (h-bh)/2, 0, (h+bh)/2);
        grad.addColorStop(0, 'rgba(255,215,0,0.8)');
        grad.addColorStop(0.5, 'rgba(212,175,55,0.9)');
        grad.addColorStop(1, 'rgba(255,215,0,0.8)');
        ctx.fillStyle = grad;
        ctx.fillRect(i * (bw + 1), (h - bh) / 2, bw, bh);
    }
    STATE.waveformAnimId = requestAnimationFrame(drawWaveform);
}

function stopWaveform() {
    if (STATE.waveformAnimId) {
        cancelAnimationFrame(STATE.waveformAnimId);
        STATE.waveformAnimId = null;
    }
    drawIdleWaveform();
}

/* ==================== TTS 生成 ==================== */
async function generateTTS() {
    const text = getEditorContent();
    if (!text) { showToast('编辑器中没有文稿内容', 'error'); return; }

    const provider = document.getElementById('ttsProvider').value;
    const speed = parseFloat(document.getElementById('speedSlider').value);

    try {
        if (provider === 'browser_tts') {
            // === 浏览器原生 Web Speech API ===
            if (!('speechSynthesis' in window)) {
                showToast('您的浏览器不支持语音合成功能，请使用 Chrome 或 Edge 浏览器', 'error');
                return;
            }
            stopPlay();
            showToast('正在朗读...', 'info');

            // 准备字幕数据
            prepareSubtitles(text);

            const btts = STATE.browserTTS;
            // 按句子分段播放（实现字幕同步）
            btts.sentences = text.replace(/\n+/g, '。').split(/[。！？；…]+/).filter(s => s.trim());
            btts.currentIdx = 0;
            btts.startTime = Date.now();
            btts.elapsed = 0;

            // 计算总时长估算（用于进度条）
            const totalChars = btts.sentences.reduce((sum, s) => sum + s.length, 0);
            const estimatedDuration = totalChars / (speed * 5); // 约300字/分钟

            // 显示波形和字幕
            document.getElementById('waveformCanvas').style.display = 'block';
            document.getElementById('subtitleBar').style.display = 'block';
            document.getElementById('previewPlaceholder').style.display = 'none';
            drawWaveform(0);
            document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
            STATE.isPlaying = true;

            // 进度条设置
            document.getElementById('progressSlider').max = estimatedDuration;
            document.getElementById('progressSlider').value = 0;
            document.getElementById('timeDisplay').textContent = '00:00 / ' + formatTime(estimatedDuration);

            // 进度更新定时器
            btts.timerId = setInterval(() => {
                btts.elapsed = (Date.now() - btts.startTime) / 1000;
                document.getElementById('progressSlider').value = btts.elapsed;
                document.getElementById('timeDisplay').textContent =
                    formatTime(btts.elapsed) + ' / ' + formatTime(estimatedDuration);
            }, 200);

            // 逐句播放
            speakSentence(0, speed, () => {
                // 全部播放完成
                clearInterval(btts.timerId);
                STATE.isPlaying = false;
                document.getElementById('playBtn').innerHTML = '&#9654;';
                document.getElementById('progressSlider').value = estimatedDuration;
                document.getElementById('timeDisplay').textContent =
                    formatTime(estimatedDuration) + ' / ' + formatTime(estimatedDuration);
                stopWaveform();
                setTimeout(() => stopPlay(), 500);
            });

            showToast('语音播放中...', 'success');

        } else {
            // === OpenAI TTS API ===
            const voice = document.getElementById('voiceSelect').value;
            showToast('正在生成语音...', 'info');

            const cfg = getConfig();
            if (!cfg.api_key) { showToast('请先填写 API 密钥', 'error'); return; }
            const base = cfg.api_base.replace(/\/+$/, '');
            const resp = await fetch(base + '/audio/speech', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + cfg.api_key
                },
                body: JSON.stringify({
                    model: cfg.model_name || 'tts-1',
                    input: text,
                    voice: voice,
                    speed: speed,
                    response_format: 'mp3'
                }),
                signal: AbortSignal.timeout(60000)
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error((err.error && err.error.message) || 'HTTP ' + resp.status);
            }
            const blob = await resp.blob();
            STATE.audioUrl = URL.createObjectURL(blob);

            prepareSubtitles(text);
            startPlayback();
            showToast('语音生成成功！', 'success');
        }
    } catch(e) {
        showToast('语音生成失败: ' + e.message, 'error');
    }
}

/* 逐句播放（浏览器TTS） */
function speakSentence(idx, speed, onDone) {
    const btts = STATE.browserTTS;
    if (idx >= btts.sentences.length) { if (onDone) onDone(); return; }

    btts.currentIdx = idx;
    // 更新字幕
    if (STATE.subtitles[idx]) {
        document.getElementById('subtitleBar').textContent = STATE.subtitles[idx].text;
    }

    const utterance = new SpeechSynthesisUtterance(btts.sentences[idx].trim());
    utterance.lang = 'zh-CN';
    utterance.rate = speed;

    // 设置选中的音色
    const voiceIdx = parseInt(document.getElementById('voiceSelect').value) || 0;
    const voices = speechSynthesis.getVoices();
    if (voices[voiceIdx]) utterance.voice = voices[voiceIdx];

    utterance.onend = () => {
        if (STATE.isPlaying) {
            speakSentence(idx + 1, speed, onDone);
        }
    };
    utterance.onerror = (e) => {
        console.warn('TTS句播放出错:', e);
        if (STATE.isPlaying) {
            speakSentence(idx + 1, speed, onDone);
        }
    };

    btts.utterance = utterance;
    speechSynthesis.speak(utterance);
}

/* ==================== 播放控制 ==================== */
function startPlayback() {
    if (!STATE.audioUrl) return;
    stopPlayback();

    STATE.audioElement = new Audio(STATE.audioUrl);
    STATE.audioElement.play().catch(e => showToast('播放失败: ' + e.message, 'error'));
    STATE.isPlaying = true;

    // 显示波形和字幕
    const canvas = document.getElementById('waveformCanvas');
    canvas.style.display = 'block';
    document.getElementById('subtitleBar').style.display = 'block';
    document.getElementById('previewPlaceholder').style.display = 'none';
    drawWaveform(0);

    document.getElementById('playBtn').innerHTML = '&#9646;&#9646;'; // 暂停图标

    // 进度更新
    STATE.audioElement.addEventListener('loadedmetadata', () => {
        document.getElementById('progressSlider').max = STATE.audioElement.duration;
        document.getElementById('timeDisplay').textContent =
            formatTime(0) + ' / ' + formatTime(STATE.audioElement.duration);
    });
    STATE.progressTimer = setInterval(() => {
        if (STATE.audioElement && !STATE.audioElement.paused) {
            const ct = STATE.audioElement.currentTime;
            const dur = STATE.audioElement.duration || 1;
            document.getElementById('progressSlider').value = ct;
            document.getElementById('timeDisplay').textContent =
                formatTime(ct) + ' / ' + formatTime(dur);
            updateSubtitle(ct);
        }
    }, 200);

    STATE.audioElement.addEventListener('ended', () => {
        stopPlayback();
    });
}

function togglePlay() {
    const provider = document.getElementById('ttsProvider').value;
    if (provider === 'browser_tts') {
        // 浏览器TTS暂停/恢复
        if (!STATE.browserTTS.utterance && !STATE.isPlaying) {
            showToast('请先生成语音', 'info'); return;
        }
        if (STATE.isPlaying && !speechSynthesis.paused) {
            speechSynthesis.pause();
            STATE.isPlaying = false;
            document.getElementById('playBtn').innerHTML = '&#9654;';
            stopWaveform();
        } else {
            speechSynthesis.resume();
            STATE.isPlaying = true;
            document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
            drawWaveform(0);
        }
        return;
    }
    // OpenAI TTS (Audio元素)
    if (!STATE.audioElement) { showToast('请先生成语音', 'info'); return; }
    if (STATE.audioElement.paused) {
        STATE.audioElement.play();
        STATE.isPlaying = true;
        document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
        drawWaveform(0);
    } else {
        STATE.audioElement.pause();
        STATE.isPlaying = false;
        document.getElementById('playBtn').innerHTML = '&#9654;';
        stopWaveform();
    }
}

function stopPlay() {
    if (STATE.audioElement) {
        STATE.audioElement.pause();
        STATE.audioElement.currentTime = 0;
    }
    // 停止浏览器TTS
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
    }
    if (STATE.browserTTS.timerId) { clearInterval(STATE.browserTTS.timerId); STATE.browserTTS.timerId = null; }
    STATE.isPlaying = false;
    document.getElementById('playBtn').innerHTML = '&#9654;';
    document.getElementById('progressSlider').value = 0;
    document.getElementById('timeDisplay').textContent = '00:00 / 00:00';
    document.getElementById('waveformCanvas').style.display = 'none';
    document.getElementById('subtitleBar').style.display = 'none';
    document.getElementById('subtitleBar').textContent = '';
    document.getElementById('previewPlaceholder').style.display = '';
    stopWaveform();
    if (STATE.progressTimer) { clearInterval(STATE.progressTimer); STATE.progressTimer = null; }
}

function stopPlayback() {
    stopPlay();
}

// 进度条拖拽
document.getElementById('progressSlider').addEventListener('input', function() {
    if (STATE.audioElement) {
        STATE.audioElement.currentTime = parseFloat(this.value);
    }

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ==================== 字幕 ==================== */
function prepareSubtitles(text) {
    // 按标点分句，估算每句时长
    const sentences = text.replace(/\n+/g, '。').split(/[。！？；…]+/).filter(s => s.trim());
    const totalChars = sentences.reduce((sum, s) => sum + s.length, 0);
    const totalDuration = Math.round(totalChars / 3); // 每分钟180字
    let cumTime = 0;
    STATE.subtitles = sentences.map(s => {
        const dur = (s.length / totalChars) * totalDuration;
        const item = { text: s.trim(), startTime: cumTime, endTime: cumTime + dur };
        cumTime += dur;
        return item;
    });
}

function updateSubtitle(currentTime) {
    let idx = -1;
    for (let i = 0; i < STATE.subtitles.length; i++) {
        if (currentTime >= STATE.subtitles[i].startTime && currentTime < STATE.subtitles[i].endTime) {
            idx = i; break;
        }
    }
    if (idx >= 0) {
        document.getElementById('subtitleBar').textContent = STATE.subtitles[idx].text;
    } else {
        document.getElementById('subtitleBar').textContent = '';
    }
}

/* ==================== 历史记录 ==================== */
function loadHistory() {
    try {
        const saved = localStorage.getItem('ai_speaking_history');
        if (saved) STATE.history = JSON.parse(saved);
    } catch(e) { STATE.history = []; }
    renderHistory();
}

function saveHistoryData() {
    try {
        localStorage.setItem('ai_speaking_history', JSON.stringify(STATE.history.slice(0, 50)));
    } catch(e) { /* 忽略 */ }
}

function saveToHistory(content) {
    const title = content.replace(/\n/g, ' ').trim().substring(0, 20);
    const time = new Date().toISOString().replace('T', ' ').substring(0, 19);
    // 去重
    const existIdx = STATE.history.findIndex(h => h.content === content);
    if (existIdx >= 0) {
        STATE.history[existIdx].time = time;
        STATE.history[existIdx].title = title;
    } else {
        STATE.history.unshift({ title, content, time });
        if (STATE.history.length > 50) STATE.history = STATE.history.slice(0, 50);
    }
    saveHistoryData();
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (STATE.history.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;">暂无历史记录</div>';
        return;
    }
    list.innerHTML = '';
    STATE.history.forEach((h, i) => {
        const div = document.createElement('div');
        div.className = 'ht-item';
        div.innerHTML = `<div class="ht-title">${escapeHtml(h.title)}</div><div class="ht-time">${h.time}</div>`;
        div.onclick = () => {
            setEditorContent(h.content);
            switchTab(0);
            list.querySelectorAll('.ht-item').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
        };
        // 右键删除
        div.oncontextmenu = (e) => {
            e.preventDefault();
            showModal('删除记录', '确定要删除这条历史记录吗？', () => {
                STATE.history.splice(i, 1);
                saveHistoryData();
                renderHistory();
                showToast('已删除', 'info');
            });
        };
        list.appendChild(div);
    });
}

function clearHistory() {
    if (STATE.history.length === 0) return;
    showModal('清空历史', '确定要清空所有历史记录吗？', () => {
        STATE.history = [];
        saveHistoryData();
        renderHistory();
        showToast('历史记录已清空', 'info');
    });
}

/* ==================== 模板库 ==================== */
let selectedTemplate = null;

function loadTemplates() {
    const list = document.getElementById('templateList');
    list.innerHTML = '';
    Object.keys(TEMPLATES).forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'ht-item';
        div.innerHTML = `<div class="ht-title">${name}</div><div class="ht-time">${TEMPLATES[name].desc.substring(0, 30)}...</div>`;
        div.onclick = () => {
            selectedTemplate = name;
            list.querySelectorAll('.ht-item').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            const tpl = TEMPLATES[name];
            document.getElementById('templatePreview').value =
                '【说明】\n' + tpl.desc + '\n\n【示例模板】\n' + tpl.example;
        };
        div.ondblclick = () => { insertTemplateToEditor(); };
        list.appendChild(div);
    });
}

function insertTemplateToEditor() {
    if (!selectedTemplate || !TEMPLATES[selectedTemplate]) {
        showToast('请先选择一个模板', 'info'); return;
    }
    const example = TEMPLATES[selectedTemplate].example;
    const ta = document.getElementById('editorTextarea');
    const start = ta.selectionStart;
    const before = ta.value.substring(0, start);
    const after = ta.value.substring(ta.selectionEnd);
    ta.value = before + example + after;
    ta.selectionStart = ta.selectionEnd = start + example.length;
    updateEditorStats();
    updateLineNumbers();
    switchTab(0);
    showToast('模板已插入编辑器', 'success');
}

/* ==================== 模态框 ==================== */
function showModal(title, message, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
        <div class="modal">
            <h3>${title}</h3>
            <p>${message}</p>
            <div class="btn-row">
                <button class="btn btn-sm" id="modalCancel">取消</button>
                <button class="btn btn-primary btn-sm" id="modalConfirm">确定</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancel').onclick = () => overlay.remove();
    overlay.querySelector('#modalConfirm').onclick = () => { overlay.remove(); if (onConfirm) onConfirm(); };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}
</script>
</body>
</html>
