<body>

  <!-- Header -->
  <header class="app-header">
    <h1>🎵 AI Volume Balancer Pro</h1>
    <p>智能适配音量  |  保持高保真原音质  |  杜绝失真</p>
  </header>

  <!-- Drag overlay -->
  <div class="drop-overlay" id="dropOverlay">拖放音频文件到此处</div>

  <!-- Main Area -->
  <div class="app-main">
    <!-- Left: File List -->
    <div class="panel-left">
      <div>
        <div class="panel-title">文件列表</div>
        <div class="actions" style="margin-top:6px">
          <button class="btn btn-secondary" id="btnAddFiles" title="添加文件">📂 添加文件</button>
          <button class="btn btn-secondary" id="btnAddFolder" title="添加文件夹">📁 添加文件夹</button>
          <button class="btn btn-danger" id="btnClear" title="清空所有">🗑️ 清空</button>
        </div>
      </div>

      <div class="file-list-wrap">
        <table class="file-list">
          <thead>
            <tr>
              <th class="col-name">文件名</th>
              <th class="col-duration">时长</th>
              <th class="col-lufs">响度</th>
              <th class="col-status">状态</th>
            </tr>
          </thead>
          <tbody id="fileListBody">
            <tr><td colspan="4" class="empty-msg">点击「添加文件」或将音频文件拖拽到此处</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Waveform -->
      <div class="waveform-section" id="waveformSection" style="display:none">
        <div class="waveform-title">波形预览对比</div>
        <div style="display:flex;gap:6px;">
          <div class="waveform-container" style="flex:1" id="waveOriginal">
            <span class="waveform-label original">原始</span>
            <canvas id="canvasOriginal"></canvas>
          </div>
          <div class="waveform-container" style="flex:1" id="waveProcessed">
            <span class="waveform-label processed">处理后</span>
            <canvas id="canvasProcessed"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Detail & Controls -->
    <div class="panel-right">
      <div>
        <div class="panel-title">文件详情</div>
      </div>
      <div class="detail-card" id="detailCard">
        <div class="detail-placeholder" id="detailPlaceholder">选择一个文件查看详情</div>
        <div id="detailContent" style="display:none">
          <div class="detail-row"><span class="detail-label">文件名</span><span class="detail-value" id="dName">--</span></div>
          <div class="detail-row"><span class="detail-label">时长</span><span class="detail-value" id="dDuration">--</span></div>
          <div class="detail-row"><span class="detail-label">采样率</span><span class="detail-value" id="dSampleRate">--</span></div>
          <div class="detail-row"><span class="detail-label">声道</span><span class="detail-value" id="dChannels">--</span></div>
          <div class="detail-row"><span class="detail-label">文件大小</span><span class="detail-value" id="dFileSize">--</span></div>
          <div class="detail-row"><span class="detail-label">原始响度</span><span class="detail-value" id="dLufs">--</span></div>
          <div class="detail-row"><span class="detail-label">峰值</span><span class="detail-value" id="dPeak">--</span></div>
          <div class="detail-row" id="dProcessedLufsRow" style="display:none"><span class="detail-label">处理后响度</span><span class="detail-value" id="dProcessedLufs">--</span></div>
          <div class="detail-row" id="dProcessedPeakRow" style="display:none"><span class="detail-label">处理后峰值</span><span class="detail-value" id="dProcessedPeak">--</span></div>
          <div class="lufs-setting">
            <label>🎯 目标响度 (LUFS)</label>
            <input type="number" id="inputTargetLufs" value="-14.0" step="0.5" min="-30" max="0">
          </div>
        </div>
      </div>

      <button class="btn btn-primary btn-big" id="btnProcess">🚀 开始云端AI处理</button>
      <button class="btn btn-success btn-download" id="btnDownload" style="display:none">💾 下载处理后的文件</button>

      <div class="engine-info">
        <strong>⚡ 引擎</strong>：Web Audio API 本地处理<br>
        <strong>🎵 标准</strong>：-14 LUFS 流媒体<br>
        <strong>🔒 限制</strong>：-1 dBTP 防削波<br>
        <strong>💎 保证</strong>：高保真软限制
      </div>

  </div>

  </div>

    <span id="fileCount">文件: 0</span>
  </footer>

  <!-- Hidden file inputs -->
  <input type="file" id="fileInput" multiple accept="audio/*" style="display:none">
  <input type="file" id="folderInput" webkitdirectory multiple style="display:none">

  <!-- Scripts -->
  <script src="./assets/audio-engine.js"></script>
  <script src="./assets/app.js"></script>
